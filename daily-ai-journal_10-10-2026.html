<style>
:root{
  --paper:#f2f1ec; --paper-2:#e9e8e1; --panel:#dde5e2;
  --ink:#15212b; --muted:#56636d; --rule:#15212b; --hair:#c9c8c0;
  --accent:#0e4f5c; --accent-ink:#ffffff; --flag:#a3341f;
  --display:"Playfair Display","Didot","Georgia",serif;
  --text:"Source Serif 4","Charter","Georgia",serif;
  --measure:66ch;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --paper:#10181e; --paper-2:#17222a; --panel:#1b2b30;
    --ink:#ecebe4; --muted:#9aa7af; --rule:#ecebe4; --hair:#33424b;
    --accent:#7cc3d1; --accent-ink:#10181e; --flag:#f08a70;
  }
}
:root[data-theme="dark"]{
  --paper:#10181e; --paper-2:#17222a; --panel:#1b2b30;
  --ink:#ecebe4; --muted:#9aa7af; --rule:#ecebe4; --hair:#33424b;
  --accent:#7cc3d1; --accent-ink:#10181e; --flag:#f08a70;
}

/* Colour-blind safe theme: Okabe-Ito blue and vermillion (distinguishable in protan, deutan and tritan vision),
   plus shape cues so no meaning depends on colour alone */
:root[data-theme="cb"]{
  --paper:#f7f6f1; --paper-2:#ecebe4; --panel:#e2e8ee;
  --ink:#10151a; --muted:#4a555e; --rule:#10151a; --hair:#bcc2c7;
  --accent:#005a8d; --accent-ink:#ffffff; --flag:#a64100;
}
:root[data-theme="cb"] .tag::before{margin-right:6px;font-size:10px}
:root[data-theme="cb"] .tag.fact::before{content:"\25A0"}
:root[data-theme="cb"] .tag.analysis::before{content:"\25C6"}
:root[data-theme="cb"] .tag.hypothesis::before{content:"\25B2"}
:root[data-theme="cb"] .tag.counter::before{content:"\25CB"}
:root[data-theme="cb"] .para.fact p{border-left:4px solid var(--accent);padding-left:12px}
:root[data-theme="cb"] .para.analysis p{border-left:4px dashed var(--ink);padding-left:12px}
:root[data-theme="cb"] .para.hypothesis p{border-left:4px dotted var(--flag);padding-left:12px}
:root[data-theme="cb"] .para.counter p{border-left:4px double var(--muted);padding-left:12px}
:root[data-theme="cb"] .meter .bar{height:10px;border:1px solid var(--ink)}
:root[data-theme="cb"] .meter .bar i{background:repeating-linear-gradient(135deg,var(--accent) 0 6px,#fff 6px 8px)}

:root[data-theme="cb"] a:not(.card a):not(nav a):not(.pager a):not(.desk-strip a){text-decoration:underline}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* Masthead */
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);
  padding:10px 0;border-bottom:1px solid var(--hair)}
.top select,.top button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--hair);padding:2px 8px;border-radius:2px;cursor:pointer}
.mast{border-top:4px solid var(--rule);border-bottom:1px solid var(--rule);text-align:center;padding:18px 0 14px;margin-top:10px}
.mast h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(46px,9vw,92px);line-height:1;letter-spacing:-.01em}
.mast h1 a{text-decoration:none}
.mast p{margin:6px 0 0;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.mast::after{content:"";display:block;margin-top:14px;border-bottom:1px solid var(--rule)}

/* Navigation */
nav.tabs{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--hair);
  padding-top:env(safe-area-inset-top,0px)}
nav.tabs ul{list-style:none;margin:0;padding:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs li{flex:0 0 auto}
nav.tabs a{display:block;padding:12px 14px;text-decoration:none;font-weight:600;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{border-bottom-color:var(--hair)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--paper);border-bottom-color:var(--ink)}

main{padding:28px 0 56px;min-height:60vh}
.kicker{font-size:13px;font-weight:600;color:var(--accent);margin:0 0 8px}
h2.hed,h1.hed{font-family:var(--display);font-weight:800;line-height:1.05;margin:0 0 12px;letter-spacing:-.01em}
.deck{font-style:italic;color:var(--muted);font-size:1.12em;line-height:1.45;margin:0 0 14px}

/* Front page */
.lead{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;padding-bottom:26px;border-bottom:1px solid var(--rule)}
.lead h2{font-size:clamp(34px,5.2vw,58px)}
.lead .sum{font-size:15.5px;color:var(--ink);margin:0 0 10px}
.byline{font-size:13px;color:var(--muted)}
.byline a{color:var(--accent)}
.readlink{display:inline-block;margin-top:10px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:4px}

/* The one memorable element: the permission boundary */
.boundary{background:var(--panel);display:grid;grid-template-rows:1fr auto 1fr;min-height:280px;padding:22px;position:relative}
.boundary .side{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.6vw,38px);line-height:1.08;display:flex;align-items:center;justify-content:center;text-align:center}
.boundary .side small{display:block;font-family:var(--text);font-weight:400;font-style:italic;font-size:14px;color:var(--muted);margin-top:6px}
.boundary .line{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--flag);font-weight:600}
.boundary .line::before,.boundary .line::after{content:"";flex:1;border-top:2px dashed var(--flag)}

.sect{font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--hair)}
.grid4{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule)}
.card{padding:16px 18px 16px 0;border-bottom:1px solid var(--hair);cursor:pointer}
.card:nth-child(even){padding-left:18px;padding-right:0;border-left:1px solid var(--hair)}
.card h3{font-family:var(--display);font-size:22px;line-height:1.15;margin:0 0 6px}
.card p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.5}
.card a{text-decoration:none}
.card:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.desk-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--rule)}
.desk-strip a{display:block;text-decoration:none;padding:14px 16px 14px 0;font-weight:600;font-size:15px;line-height:1.35;border-bottom:1px solid var(--hair)}
.desk-strip a+a{padding-left:16px;border-left:1px solid var(--hair)}
.desk-strip span{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:4px}
.takeaway{background:var(--panel);margin-top:26px;padding:18px 22px;border-left:5px solid var(--accent)}
.takeaway h3{font-family:var(--display);font-style:italic;font-size:20px;margin:0 0 4px}
.takeaway p{margin:0;font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(19px,2.6vw,25px);line-height:1.3}

/* Article */
.article{max-width:820px;margin:0 auto}
.article h1.hed{font-size:clamp(34px,6vw,56px)}
.meta{font-size:13.5px;color:var(--muted);border-top:1px solid var(--rule);border-bottom:1px solid var(--hair);padding:8px 0;margin:14px 0 22px;display:flex;flex-wrap:wrap;gap:6px 18px}
.para{display:grid;grid-template-columns:96px 1fr;gap:0 18px;margin:0 0 18px}
.tag{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding-top:6px}
.tag.fact{color:var(--accent)} .tag.analysis{color:var(--ink)} .tag.hypothesis{color:var(--flag)} .tag.counter{color:var(--muted)}
.para p{margin:0;max-width:var(--measure);font-size:18px;line-height:1.65}
.para.analysis p,.para.hypothesis p{font-style:italic}
.why{border-top:3px double var(--rule);border-bottom:1px solid var(--hair);padding:14px 0;margin:28px 0}
.why h3{margin:0 0 4px;font-family:var(--display);font-size:20px}
.why p{margin:0}
.sources{font-size:14px;color:var(--muted)}
.sources h3{font-family:var(--display);font-size:17px;color:var(--ink);margin:0 0 6px}
.sources ul{margin:0;padding-left:18px}
.sources a{color:var(--accent)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:34px;border-top:1px solid var(--rule);padding-top:16px}
.pager a{text-decoration:none;display:block}
.pager small{display:block;color:var(--muted);font-size:13px}
.pager strong{font-family:var(--display);font-size:18px;line-height:1.2;display:block}
.pager a:last-child{text-align:right}
.pager a:hover strong{text-decoration:underline;text-underline-offset:4px}

/* News desk & analysis */
.brief{padding:16px 0;border-bottom:1px solid var(--hair);display:grid;grid-template-columns:150px 1fr;gap:6px 24px}
.brief .when{font-size:13px;color:var(--muted)}
.brief h3{font-family:var(--display);font-size:22px;line-height:1.15;margin:0 0 6px}
.brief p{margin:0 0 6px;max-width:var(--measure)}
.brief .src{font-size:13.5px}
.brief .src a{color:var(--accent)}
.analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:20px}
.box{border-top:3px solid var(--rule);padding-top:12px}
.box h3{font-family:var(--display);font-size:22px;margin:0 0 8px}
.box p{margin:0 0 10px}
.meter{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin-top:6px}
.meter div{min-width:140px}
.meter .bar{height:6px;background:var(--hair);margin-top:4px;position:relative}
.meter .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.take{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(24px,3.6vw,36px);line-height:1.25;margin:0 0 18px;max-width:30em}
.legend{font-size:14px;color:var(--muted);margin-top:28px;border-top:1px solid var(--hair);padding-top:12px}
.legend b{font-weight:600}


/* Signature band */
.sign{background:var(--ink);color:var(--paper);margin-top:8px}
.sign .wrap{display:grid;grid-template-columns:auto 1fr auto;gap:22px 34px;align-items:center;padding-top:34px;padding-bottom:34px}
.sign .mono{width:84px;height:84px;border:2px solid var(--paper);border-radius:50%;display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.02em}
.sign .k{font-size:13px;font-weight:600;opacity:.8;margin:0 0 6px}
.sign h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,40px);line-height:1.1;margin:0 0 8px}
.sign p.t{margin:0;max-width:54ch;opacity:.9;font-size:16px}
.sign .actions{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.sign .btn{display:inline-block;text-align:center;text-decoration:none;font-weight:600;font-size:16px;padding:14px 22px;border:2px solid var(--paper);
  background:var(--paper);color:var(--ink);transition:transform .15s ease}
.sign .btn.alt{background:transparent;color:var(--paper)}
.sign .btn:hover{transform:translateY(-2px)}
.sign a:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
@media (max-width:820px){
  .sign .wrap{grid-template-columns:1fr;text-align:left}
  .sign .mono{width:64px;height:64px;font-size:26px}
}
@media (prefers-reduced-motion:reduce){.sign .btn{transition:none}.sign .btn:hover{transform:none}}
footer{border-top:4px solid var(--rule);padding:16px 0 30px;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:820px){
  .lead{grid-template-columns:1fr}
  .boundary{min-height:220px}
  .analysis-grid{grid-template-columns:1fr}
  .desk-strip{grid-template-columns:1fr}
  .desk-strip a+a{padding-left:0;border-left:0}
}
@media (max-width:620px){
  body{font-size:16.5px}
  .grid4{grid-template-columns:1fr}
  .card,.card:nth-child(even){padding:14px 0;border-left:0}
  .para{grid-template-columns:1fr}
  .tag{padding:0 0 3px}
  .para p{font-size:17px}
  .brief{grid-template-columns:1fr}
  .pager{grid-template-columns:1fr}
  .pager a:last-child{text-align:left}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{nav.tabs,.top button,.top select,.pager{display:none}body{background:#fff;color:#000}}
</style>

<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById("edition-data").textContent);
  var editions = DATA.editions;
  var ed = editions[0];
  var view = document.getElementById("view");
  var KIND = { fact:"Fact", analysis:"Analysis", hypothesis:"Hypothesis", counter:"Counter-evidence" };

  function fmt(d, long){
    return new Date(d + "T12:00:00").toLocaleDateString("en-GB",
      long ? { weekday:"long", day:"numeric", month:"long", year:"numeric" } : { day:"numeric", month:"short", year:"numeric" });
  }
  function art(id){ return ed.articles.filter(function(a){return a.id===id;})[0]; }
  function order(){ return [ed.lead].concat(ed.stories); }
  function link(s){ return '<a href="'+s.url+'" target="_blank" rel="noopener noreferrer">'+s.label+'</a>'; }

  /* ---------- views ---------- */
  function front(){
    var lead = art(ed.lead), p = ed.leadPanel;
    var cards = ed.stories.map(function(id){
      var a = art(id);
      return '<article class="card"><p class="kicker">'+a.section+'</p><h3><a href="#/article/'+a.id+'">'+a.headline+'</a></h3><p>'+a.deck+'</p></article>';
    }).join("");
    var strip = ed.news.slice(0,3).map(function(n){
      return '<a href="#/news"><span style="color:var(--accent);font-weight:600;margin:0 0 4px">'+n.section+'</span>'+n.headline+'<span>'+fmt(n.date)+'</span></a>';
    }).join("");
    return '' +
    '<section class="lead" aria-labelledby="lead-h">' +
      '<div><p class="kicker">Saturday edition, lead story</p>' +
      '<h2 class="hed" id="lead-h"><a href="#/article/'+lead.id+'" style="text-decoration:none">'+lead.headline+'</a></h2>' +
      '<p class="deck">'+lead.deck+'</p>' +
      '<p class="sum">'+lead.summary+'</p>' +
      '<p class="byline">Based on reporting from '+link(lead.sources[0])+', '+fmt(lead.date)+'.</p>' +
      '<a class="readlink" href="#/article/'+lead.id+'">Read the story</a></div>' +
      '<div class="boundary" role="img" aria-label="'+p.from+', then a permission boundary, then '+p.to+'">' +
        '<div class="side">'+p.from+'</div>' +
        '<div class="line">'+p.line+'</div>' +
        '<div class="side">'+p.to+'</div>' +
      '</div>' +
    '</section>' +
    '<h2 class="sect">The stories that matter</h2>' +
    '<div class="grid4">'+cards+'</div>' +
    '<h2 class="sect">From the news desk</h2>' +
    '<div class="desk-strip">'+strip+'</div>' +
    '<aside class="takeaway"><h3>The takeaway</h3><p>'+ed.takeaway+'</p></aside>';
  }

  function article(id){
    var a = art(id); if(!a){ return notFound(); }
    var o = order(), i = o.indexOf(id);
    var prev = i>0 ? art(o[i-1]) : null, next = i<o.length-1 ? art(o[i+1]) : null;
    var paras = a.body.map(function(b){
      return '<div class="para '+b.k+'"><span class="tag '+b.k+'">'+KIND[b.k]+'</span><p>'+b.t+'</p></div>';
    }).join("");
    var reg = a.regulatory ? '<span><strong>Regulatory status:</strong> '+a.regulatory+'</span>' : "";
    return '<article class="article">' +
      '<p class="kicker">'+a.section+'</p>' +
      '<h1 class="hed">'+a.headline+'</h1>' +
      '<p class="deck">'+a.deck+'</p>' +
      '<div class="meta"><span>'+fmt(a.date, true)+'</span><span>'+a.reading+'</span>'+reg+'</div>' +
      paras +
      '<div class="why"><h3>Why it matters</h3><p>'+a.why+'</p></div>' +
      '<div class="sources"><h3>Sources</h3><ul>'+a.sources.map(function(s){return '<li>'+link(s)+'</li>';}).join("")+'</ul></div>' +
      '<p style="margin-top:22px"><a class="readlink" href="#/take">Read the analysis</a></p>' +
      '<nav class="pager" aria-label="More stories">' +
        (prev ? '<a href="#/article/'+prev.id+'" rel="prev"><small>Previous story</small><strong>'+prev.headline+'</strong></a>' : '<a href="#/front"><small>Back to</small><strong>The front page</strong></a>') +
        (next ? '<a href="#/article/'+next.id+'" rel="next"><small>Next story</small><strong>'+next.headline+'</strong></a>' : '<a href="#/news"><small>Continue to</small><strong>News desk</strong></a>') +
      '</nav></article>';
  }

  function news(){
    var briefs = ed.news.map(function(n){
      return '<article class="brief"><div class="when"><p class="kicker" style="margin:0">'+n.section+'</p>'+fmt(n.date)+'</div>' +
        '<div><h3>'+n.headline+'</h3><p>'+n.text+'</p><p class="src">Source: '+link(n.source)+'</p></div></article>';
    }).join("");
    var all = order().map(function(id){
      var a = art(id);
      return '<article class="brief"><div class="when"><p class="kicker" style="margin:0">'+a.section+'</p>'+fmt(a.date)+'</div>' +
        '<div><h3><a href="#/article/'+a.id+'" style="text-decoration:none">'+a.headline+'</a></h3><p>'+a.deck+'</p></div></article>';
    }).join("");
    return '<h1 class="hed" style="font-size:clamp(32px,5vw,48px)">News desk</h1>' +
      '<p class="deck">Short, dated items that did not need a full story.</p>' + briefs +
      '<h2 class="sect" style="margin-top:34px">All stories in this edition</h2>' + all;
  }

  function meter(label, v){
    return '<div><span>'+label+': <strong>'+v+'/10</strong></span><div class="bar" role="img" aria-label="'+label+' '+v+' out of 10"><i style="width:'+(v*10)+'%"></i></div></div>';
  }
  function take(){
    var A = ed.analysis, s = A.signalOfDay, w = A.weakSignal;
    return '<p class="kicker">My take</p>' +
      '<h1 class="take">'+A.take+'</h1>' +
      '<div class="analysis-grid">' +
        '<section class="box"><h3>Signal of the day</h3><p><strong>'+s.title+'.</strong> '+s.text+'</p>' +
          '<div class="meter">'+meter("Importance", s.importance)+meter("Confidence", s.confidence)+'</div></section>' +
        '<section class="box"><h3>Weak signal</h3><p><strong>'+w.title+'.</strong> '+w.text+'</p>' +
          '<div class="meter">'+meter("Confidence", w.confidence)+'</div>' +
          '<p style="font-size:14px;margin-top:10px">Source: '+link(w.source)+'</p></section>' +
      '</div>' +
      '<aside class="takeaway"><h3>The takeaway</h3><p>'+ed.takeaway+'</p></aside>' +
      '<section class="box" style="margin-top:26px"><h3>A question for your next leadership meeting</h3><p style="font-family:var(--display);font-style:italic;font-size:22px;line-height:1.3">'+A.question+'</p></section>' +
      '<p class="legend"><b>How to read this journal.</b> Each paragraph is labelled <b>Fact</b> (dated and sourced), <b>Analysis</b> (the editor’s interpretation), <b>Hypothesis</b> (forward-looking, based on current industry trends) or <b>Counter-evidence</b> (credible information that weakens the conclusion).</p>';
  }

  function notFound(){
    return '<h1 class="hed">Page not found</h1><p>This story is not in the selected edition. <a href="#/front">Return to the front page</a>.</p>';
  }

  /* ---------- routing ---------- */
  function route(){
    var h = location.hash || "#/front", parts = h.replace(/^#\/?/, "").split("/");
    var page = parts[0] || "front", html, tab = page, title = "";
    if(page==="front"){ html = front(); title = "The front page"; }
    else if(page==="story"){ location.replace("#/article/"+ed.lead); return; }
    else if(page==="article"){
      html = article(parts[1]); var a = art(parts[1]);
      tab = parts[1]===ed.lead ? "story" : "front"; title = a ? a.headline : "Not found";
    }
    else if(page==="news"){ html = news(); title = "News desk"; }
    else if(page==="take"){ html = take(); title = "My take"; }
    else { html = notFound(); title = "Not found"; }
    view.innerHTML = html;
    document.title = title + " | Daily AI";
    Array.prototype.forEach.call(document.querySelectorAll("nav.tabs a"), function(el){
      if(el.getAttribute("data-tab")===tab){ el.setAttribute("aria-current","page"); el.scrollIntoView({inline:"center",block:"nearest"}); }
      else el.removeAttribute("aria-current");
    });
    window.scrollTo(0,0);
    document.getElementById("main").focus({preventScroll:true});
  }

  /* ---------- chrome ---------- */
  function signature(){
    var s = DATA.signature; if(!s){ return; }
    var initials = s.brand.split(/\s+/).filter(function(w){return w[0] === w[0].toUpperCase();}).slice(0,2).map(function(w){return w[0];}).join("");
    var btns = s.links.map(function(l){
      return '<a class="btn'+(l.primary ? '' : ' alt')+'" href="'+l.url+'" target="_blank" rel="noopener noreferrer">'+l.label+'</a>';
    }).join("");
    document.getElementById("signature").innerHTML =
      '<div class="wrap"><div class="mono" aria-hidden="true">'+initials+'</div>' +
      '<div><p class="k">'+s.kicker+'</p><h2 id="sign-h">'+s.headline+'</h2><p class="t">'+s.text+'</p></div>' +
      '<div class="actions">'+btns+'</div></div>';
  }
  function chrome(){
    signature();
    document.getElementById("dateline").textContent = fmt(ed.date, true) + " | Pilot edition";
    document.getElementById("foot-left").textContent = "Daily AI, the AI business journal. Provided by " + DATA.signature.brand + ". Edition of " + fmt(ed.date) + ".";
    var sel = document.getElementById("edsel");
    sel.innerHTML = editions.map(function(e,i){ return '<option value="'+i+'">'+fmt(e.date)+'</option>'; }).join("");
    sel.style.display = editions.length>1 ? "" : "none";
    sel.onchange = function(){ ed = editions[+sel.value]; chrome(); location.hash = "#/front"; route(); };
  }
  var THEMES = ["light","dark","cb"], LABEL = { light:"Light", dark:"Dark", cb:"Colour-blind safe" };
  var btn = document.getElementById("theme");
  function current(){
    var t = document.documentElement.getAttribute("data-theme");
    return t || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  function setTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    btn.textContent = "Theme: " + LABEL[t];
    btn.setAttribute("aria-label", "Colour theme: " + LABEL[t] + ". Activate to change.");
    try{ localStorage.setItem("daily-ai-theme", t); }catch(e){}
  }
  var saved = null;
  try{ saved = localStorage.getItem("daily-ai-theme"); }catch(e){}
  setTheme(THEMES.indexOf(saved) > -1 ? saved : current());
  btn.onclick = function(){ setTheme(THEMES[(THEMES.indexOf(current()) + 1) % THEMES.length]); };
  window.addEventListener("hashchange", route);
  chrome(); route();
})();
</script>
</body>
</html>
