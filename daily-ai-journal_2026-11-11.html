  "deck": "Google DeepMind says AlphaProof Code generated about 6.5 million lines of machine-checked Lean proof over the compiled binary of libsignal, in four weeks, with a team of five.",
  "summary": "Formal verification has always been the gold standard of software assurance and almost nobody could afford it. DeepMind's claim is not that a model wrote better code, but that agents absorbed the part of verification that used to cost years of expert labour, leaving humans to argue about what should be proved.",

  "body": [

    "t": "Google DeepMind published AlphaProof Code on 10 November, a multi-agent framework that proved key security properties of libsignal — the reference implementation of the Signal protocol — against its compiled AArch64 machine code. The proofs cover the post-quantum PQXDH handshake and the Triple Ratchet, establishing forward secrecy, authentication, post-compromise security and handshake secrecy."

    "k": "fact",
    "t": "The scale is the headline. Agents produced roughly 6.5 million lines of Lean proof resting on about 26,000 lines of trusted specifications and AArch64 semantics. The work took four weeks for a team of five, and the authors state that no human wrote proof code. For comparison, the paper notes that verifying the seL4 microkernel took twenty person-years."
   },
   {
    "k": "analysis",
    "t": "The architecture matters more than the line count. Proofs are untrusted: Lean's kernel rejects any logical error, so the reliability of the result does not depend on the reliability of the agents producing it. What must be trusted is the specification — the human-approved statement of what security means. DeepMind's own framing is that the bottleneck has moved from writing proofs to deciding what to prove."
   },

    "k": "counter",
    "t": "The guarantees are bounded and the paper says so. Coverage is one-to-one sessions; group messaging is excluded, key generation is not verified, and side channels are out of scope. Symbolic proofs assume perfect cryptography, and the computational bounds offer no guarantee against a quantum adversary. Thirty-seven low-level routines are replaced by contracts rather than verified."
   },
   {
    "k": "analysis",
    "t": "For a buyer, the usable signal is narrow but real. A vendor can now plausibly be asked what its critical module proves, not merely what it tests. The honest caveat is cost: four weeks of five specialists and, in the lead author's words, a great many tokens. This is a capability that has become possible, not yet one that has become cheap."

  const root = document.getElementById('journal');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const host = u => { try { return new URL(u).hostname.replace(/^www\./,''); } catch(e) { return ''; } };
  const link = (s,u,t,id) => `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer"${t?` data-track="${t}" data-id="${esc(id)}" data-domain="${esc(host(u))}"`:''}>${esc(s)}</a>`;
  const UI = {
    en:{light:'Light theme',dark:'Dark theme',colourblind:'Colour-blind theme',lang:'Language',tag:'Executive AI intelligence · Research, implications, decisions',read:'read',more:'Read analysis ↓',why:'WHY IT MATTERS',src:'Sources',open:'Open source ↗',imp:'IMPORTANCE',conf:'CONFIDENCE',
      h:['The briefing','The lead analysis','News desk · supporting analysis','News desk · quick reads','The editor’s notebook','Takeaway','My take','The closing question'],sig:'Signal of the day',weak:'Weak signal',
      nav:['Briefing','Lead analysis','Analyses','News desk','Notebook','Takeaway','My take','Question'],kinds:{fact:'fact',analysis:'analysis',hypothesis:'hypothesis',counter:'counter-evidence'},notice:'',
      foot:'Editorial note: facts are attributed to the linked sources. Analysis and forward-looking hypotheses are labelled separately. This journal is not legal advice.'},
    fr:{light:'Thème clair',dark:'Thème sombre',colourblind:'Thème daltonien',lang:'Langue',tag:'Veille IA pour dirigeants · Recherche, implications, décisions',read:'de lecture',more:'Lire l’analyse ↓',why:'POURQUOI C’EST IMPORTANT',src:'Sources',open:'Ouvrir la source ↗',imp:'IMPORTANCE',conf:'CONFIANCE',
      h:['Le briefing','L’analyse principale','Salle de presse · analyses complémentaires','Salle de presse · brèves','Le carnet de l’éditeur','À retenir','Mon avis','La question de clôture'],sig:'Signal du jour',weak:'Signal faible',
      nav:['Briefing','Analyse principale','Analyses','Brèves','Carnet','À retenir','Mon avis','Question'],kinds:{fact:'fait',analysis:'analyse',hypothesis:'hypothèse',counter:'contre-éléments'},notice:'',
      foot:'Note éditoriale : les faits sont attribués aux sources liées. Les analyses et hypothèses prospectives sont signalées séparément. Ce journal ne constitue pas un avis juridique.'},
    it:{light:'Tema chiaro',dark:'Tema scuro',colourblind:'Tema daltonici',lang:'Lingua',tag:'Intelligence sull’IA per dirigenti · Ricerca, implicazioni, decisioni',read:'di lettura',more:'Leggi l’analisi ↓',why:'PERCHÉ È IMPORTANTE',src:'Fonti',open:'Apri la fonte ↗',imp:'IMPORTANZA',conf:'CONFIDENZA',
      h:['Il briefing','L’analisi principale','Redazione · analisi di approfondimento','Redazione · brevi','Il taccuino dell’editore','Spunto chiave','La mia opinione','La domanda finale'],sig:'Segnale del giorno',weak:'Segnale debole',
      nav:['Briefing','Analisi principale','Approfondimenti','Brevi','Taccuino','Spunto chiave','Opinione','Domanda'],kinds:{fact:'fatto',analysis:'analisi',hypothesis:'ipotesi',counter:'controprove'},notice:'',
      foot:'Nota editoriale: i fatti sono attribuiti alle fonti collegate. Analisi e ipotesi prospettiche sono indicate separatamente. Questo giornale non costituisce consulenza legale.'}
  };
  const merge = (b,o) => o===undefined||o===null ? b : Array.isArray(b)&&Array.isArray(o) ? b.map((x,i)=>merge(x,o[i])) : (b&&typeof b==='object'&&typeof o==='object') ? Object.assign({},b,Object.fromEntries(Object.keys(o).map(k=>[k,merge(b[k],o[k])]))) : o;
  const store = {get(){try{return localStorage.getItem('dailyai-lang')}catch(e){return null}},set(v){try{localStorage.setItem('dailyai-lang',v)}catch(e){}}};

  /* ===== Analytics config: fill ONE provider, leave the others empty. Nothing is sent while provider is ''. ===== */
  const TRACKING = { provider:'',            // 'plausible' | 'goatcounter' | 'ga4' | ''
                     plausibleDomain:'',     // e.g. techaddictitfr.github.io
                     goatcounterCode:'',     // e.g. mdc  (-> mdc.goatcounter.com)
                     ga4Id:'',               // e.g. G-XXXXXXXXXX (cookies: needs consent in the EU)
                     debug:false };          // true or ?track=debug logs events in the console
  const KEYS = ['briefing','lead','analyses','news','notebook','takeaway','take','question'];
  const dnt = navigator.doNotTrack==='1' || window.doNotTrack==='1';
  const debug = TRACKING.debug || /[?&]track=debug/.test(location.search);
  const live = !!TRACKING.provider && !dnt && /^https?:$/.test(location.protocol);
  (function loadProvider(){
    if(!live) return;
    const add = (src,attrs) => { const el=document.createElement('script'); el.async=true; el.src=src; Object.keys(attrs||{}).forEach(k=>el.setAttribute(k,attrs[k])); document.head.appendChild(el); };
    if(TRACKING.provider==='plausible' && TRACKING.plausibleDomain){ window.plausible=window.plausible||function(){(window.plausible.q=window.plausible.q||[]).push(arguments)}; add('https://plausible.io/js/script.js',{'data-domain':TRACKING.plausibleDomain,defer:''}); }
    if(TRACKING.provider==='goatcounter' && TRACKING.goatcounterCode){ add('https://gc.zgo.at/count.js',{'data-goatcounter':'https://'+TRACKING.goatcounterCode+'.goatcounter.com/count'}); }
    if(TRACKING.provider==='ga4' && TRACKING.ga4Id){ window.dataLayer=window.dataLayer||[]; window.gtag=function(){dataLayer.push(arguments)}; gtag('js',new Date()); gtag('config',TRACKING.ga4Id,{anonymize_ip:true}); add('https://www.googletagmanager.com/gtag/js?id='+encodeURIComponent(TRACKING.ga4Id)); }
  })();
  function track(name, props){
    const p = Object.assign({edition:data.date, lang:lang}, props||{});
    Object.keys(p).forEach(k=>{ if(p[k]===undefined||p[k]==='') delete p[k]; });
    if(debug) console.log('[track]', name, p);
    if(!live) return;
    try{
      if(TRACKING.provider==='plausible' && window.plausible) window.plausible(name,{props:p});
      else if(TRACKING.provider==='goatcounter'){ const send=()=>window.goatcounter&&window.goatcounter.count&&window.goatcounter.count({path:name+'/'+(p.id||p.domain||''),title:name+' '+JSON.stringify(p),event:true}); window.goatcounter&&window.goatcounter.count?send():setTimeout(send,1500); }
      else if(TRACKING.provider==='ga4' && window.gtag) window.gtag('event',name,p);
    }catch(e){}
  }
  const seen = new Set(); const once = (name,id) => { const k=name+':'+id; if(seen.has(k)) return; seen.add(k); track(name,{id:id}); };
  let observers = []; const timers = new Map(); const dwell = (el,fn) => { clearTimeout(timers.get(el)); timers.set(el,setTimeout(fn,1500)); };  // a view = still on screen after 1.5 s
  function goHash(){
    const h=location.hash.slice(1); if(!h) return;
    let id=h.replace('/article/','article-'); const m=h.match(/^\/section\/(\w+)/);
    if(m && KEYS.indexOf(m[1])>=0) id='sec-'+KEYS.indexOf(m[1]);
    const t=document.getElementById(id); if(t) t.scrollIntoView();
  }
  document.addEventListener('click', e => { const el=e.target.closest('[data-track]'); if(el) track(el.dataset.track,{id:el.dataset.id,domain:el.dataset.domain}); });
  document.getElementById('shortcuts').addEventListener('click', e => {
    const a=e.target.closest('a[data-section]'); if(!a) return; e.preventDefault();
    const t=document.getElementById(a.dataset.section); if(!t) return;
    t.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
    history.replaceState(null,'',location.pathname+location.search+'#/section/'+a.dataset.id);
  });
  function watch(){
    observers.forEach(o=>o.disconnect()); observers=[];
    const nav=document.getElementById('shortcuts');
    const o1=new IntersectionObserver(es=>es.forEach(en=>{ if(!en.isIntersecting){ clearTimeout(timers.get(en.target)); return; }
      nav.querySelectorAll('a').forEach(a=>{const on=a.dataset.section===en.target.id; a.classList.toggle('on',on); on?a.setAttribute('aria-current','true'):a.removeAttribute('aria-current'); if(on&&a.scrollIntoView) nav.scrollLeft=Math.max(0,a.offsetLeft-60);});
      dwell(en.target,()=>once('section_view',KEYS[+en.target.id.slice(4)])); }),{rootMargin:'-10% 0px -80% 0px'});
    document.querySelectorAll('.section-title[id^="sec-"]').forEach(el=>o1.observe(el));
    const o2=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting) dwell(en.target,()=>once('article_view',en.target.id.replace(/^article-/,'').replace(/-full$/,''))); else clearTimeout(timers.get(en.target)); }),{threshold:.25});
    document.querySelectorAll('.story').forEach(el=>o2.observe(el));
    observers=[o1,o2];
  }
  const pick = l => UI[l] ? l : 'en';
  const T0 = document.title;
  let lang = pick(new URLSearchParams(location.search).get('lang') || store.get() || 'en');

  function render(){
    const u = UI[lang], d = lang==='en' ? data : merge(data, (data.i18n||{})[lang]);
    const lead = d.lead, A = d.analysis;
    const sourceList = a => (a.sources||[]).map(s=>`<li>${link(s.label,s.url,'source_click',a.id)}</li>`).join('');
    const para = p => `<p class="body-p"><span class="kind">${esc(u.kinds[p.k]||p.k)}</span><br>${esc(p.t)}</p>`;
    let out = `<section class="front-grid"><article class="lead" id="article-${esc(lead.id)}"><div class="eyebrow">${esc(lead.section)}</div><h1>${esc(lead.headline)}</h1><p class="deck">${esc(lead.deck)}</p><p>${esc(lead.summary)}</p><p class="byline">${esc(lead.date)} · ${esc(lead.reading)} ${esc(u.read)}</p></article><aside class="panel"><div class="eyebrow">${esc(d.leadPanel.label)}</div><h2>${esc(d.leadPanel.title)}</h2><p>${esc(d.leadPanel.text)}</p></aside></section>`;
    out += `<h2 class="section-title" id="sec-0">${u.h[0]}</h2><section class="article-list">${d.articles.map(a=>`<article class="article-card"><div class="eyebrow">${esc(a.section)}</div><h3>${esc(a.headline)}</h3><p>${esc(a.deck)}</p><a href="#article-${esc(a.id)}" data-track="article_open" data-id="${esc(a.id)}">${u.more}</a></article>`).join('')}</section>`;
    out += `<h2 class="section-title" id="sec-1">${u.h[1]}</h2><article class="story" id="article-${esc(lead.id)}-full"><div class="eyebrow">${esc(lead.section)}</div><h2>${esc(lead.headline)}</h2><p class="deck">${esc(lead.deck)}</p><div class="story-body">${lead.body.map(para).join('')}<div class="why"><strong>${u.why}</strong><p>${esc(lead.why)}</p></div><h3>${u.src}</h3><ul class="source-list">${sourceList(lead)}</ul></div></article>`;
    out += `<h2 class="section-title" id="sec-2">${u.h[2]}</h2>`;
    out += d.articles.map(a=>`<article class="story" id="article-${esc(a.id)}"><div class="eyebrow">${esc(a.section)}</div><h2>${esc(a.headline)}</h2><p class="deck">${esc(a.deck)}</p><div class="story-body"><p>${esc(a.summary)}</p>${a.body.map(para).join('')}<div class="why"><strong>${u.why}</strong><p>${esc(a.why)}</p></div><h3>${u.src}</h3><ul class="source-list">${sourceList(a)}</ul>${a.regulatory?`<p class="footnote">${esc(a.regulatory)}</p>`:''}</div></article>`).join('');
    out += `<h2 class="section-title" id="sec-3">${u.h[3]}</h2><section class="news-list">${d.news.map((n,i)=>`<article class="news-item"><strong>${esc(n.section)}</strong><h3>${esc(n.headline)}</h3><p>${esc(n.summary)}</p>${link(u.open,n.url,'news_click',i+1)}</article>`).join('')}</section>`;
    out += `<h2 class="section-title" id="sec-4">${u.h[4]}</h2><section class="insights"><article class="insight"><div class="eyebrow">${u.sig}</div><h2>${esc(A.signalOfDay.title)}</h2><p class="score">${u.imp} ${esc(A.signalOfDay.importance)}/10 · ${u.conf} ${esc(A.signalOfDay.confidence)}/10</p><p>${esc(A.signalOfDay.text)}</p></article><article class="insight"><div class="eyebrow">${u.weak}</div><h2>${esc(A.weakSignal.title)}</h2><p class="score">${u.conf} ${esc(A.weakSignal.confidence)}/10</p><p>${esc(A.weakSignal.text)}</p></article></section>`;
    out += `<h2 class="section-title" id="sec-5">${u.h[5]}</h2><p class="takeaway">${esc(d.takeaway)}</p><h2 class="section-title" id="sec-6">${u.h[6]}</h2><p class="deck">${esc(A.take)}</p><h2 class="section-title" id="sec-7">${u.h[7]}</h2><p class="closing-question">${esc(A.question)}</p>`;
    root.innerHTML = out;
    document.getElementById('shortcuts').innerHTML = u.nav.map((l,i)=>`<a href="#/section/${KEYS[i]}" data-section="sec-${i}" data-track="nav_click" data-id="${KEYS[i]}">${esc(l)}</a>`).join('');
    const $ = id => document.getElementById(id);
    document.documentElement.lang = lang;
    ['light','dark','colourblind'].forEach(t=>$('t-'+t).textContent=u[t]);
    $('lang-lbl').textContent = u.lang; $('dl-tag').textContent = u.tag; $('foot').textContent = u.foot;
    $('dl-date').textContent = new Intl.DateTimeFormat(lang==='en'?'en-GB':lang,{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(data.date+'T12:00:00'));
    document.title = lang==='en' ? T0 : d.title+' | '+$('dl-date').textContent.split(' ').slice(-3).join(' ');
    $('notice').hidden = !u.notice; $('notice').textContent = u.notice;
    document.querySelectorAll('[data-set-lang]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.setLang===lang));
    watch(); goHash();
  }
  document.querySelectorAll('[data-set-theme]').forEach(b=>b.addEventListener('click',()=>document.documentElement.setAttribute('data-theme',b.dataset.setTheme)));
  document.querySelectorAll('[data-set-lang]').forEach(b=>b.addEventListener('click',()=>{lang=pick(b.dataset.setLang);store.set(lang);const p=new URLSearchParams(location.search);p.set('lang',lang);history.replaceState(null,'',location.pathname+'?'+p+location.hash);render();}));
  render();
})();
</script>
